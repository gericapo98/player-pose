[project]
name = "player-pose"
version = "0.1.0"
description = "Player pose tracking for sports video on Apple Silicon: Apple Vision body pose + SORT, per-frame CSV and overlay"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = ["pose-estimation", "tracking", "sort", "apple-vision", "apple-silicon", "sports", "badminton"]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "pyobjc-framework-Vision>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
player-pose-track = "player_pose.track:main"
player-pose-overlay = "player_pose.overlay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/player_pose"]
